<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B4A2F">
<title>Agenda Garbanzo Cimarrón</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<!--
  Agenda de reservas · Comedor Garbanzo Cimarrón
  ------------------------------------------------
  - Datos: localStorage, clave propia "garbanzo-cimarron.agenda.v1" (ver STORAGE_KEY).
    La semilla se carga solo si esa clave no existe. Una lista vacía guardada NO vuelve a sembrar.
  - Clave del panel del encargado: "garbanzo2026" (ver PANEL_CLAVE). Es una clave compartida que
    se valida en el navegador: no hay cuentas, alta de usuarios ni recuperación de acceso.
  - Duplicados: misma combinación correo + fecha + servicio entre reservas que ocupan lugar.
    El correo se compara sin espacios en los extremos y en minúsculas.
  - Ocupan lugar: Pendiente, Confirmada, Sentada y Finalizada (todo el servicio, sin cálculo por hora).
    Liberan: Cancelada y No vino.
  - Para probar un fallo de guardado: en la consola, window.__simularFalloGuardado = true
-->
<style>
:root{
  /* Grilla de cuaderno: el mes en 7 columnas con el lunes gris a la izquierda; cada día, dos puntos (almuerzo · cena) */
  --crema:#F7F1E3; --monte:#3B4A2F; --barro:#C4663A; --carbon:#2A2A22; --blanco:#FFFFFF; --maiz:#E5B73B; --aji:#B23A32;
  --ok:#5E7D3E; --cerrado:#D6CEBA; --lunes:#EDE5D2; --papel:#FCF9F1;
  --linea:rgba(59,74,47,.14); --linea-2:rgba(59,74,47,.30); --suave:rgba(42,42,34,.64);
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radio:10px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--crema);color:var(--monte)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--crema)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--barro);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.005em;text-wrap:balance;margin:0;color:var(--monte)}
.num,.tab{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--crema);border-bottom:1px solid var(--linea-2)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand small{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--barro)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--monte);margin-top:3px}
.topbar .hoy{font-size:12px;font-weight:700;color:var(--suave);text-align:right}

main.wrap{padding-block:16px calc(104px + env(safe-area-inset-bottom,0px))}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--monte);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr;gap:4px;padding-block:8px}
.tabbar button{appearance:none;border:0;background:transparent;color:rgba(247,241,227,.72);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 2px;border-radius:8px;min-height:48px;justify-content:center}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--crema);background:rgba(247,241,227,.10)}
.tabbar .reservar{background:var(--barro);color:var(--blanco);flex-direction:row;gap:6px;font-size:14px;letter-spacing:.01em}
.tabbar .reservar[aria-current="page"]{background:var(--barro);color:var(--blanco);box-shadow:inset 0 0 0 2px var(--crema)}

/* Botones */
.btn{appearance:none;border:1.5px solid var(--monte);background:transparent;color:var(--monte);font-weight:800;font-size:14px;border-radius:999px;padding:10px 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.solid{background:var(--monte);color:var(--crema)}
.btn.barro{background:var(--barro);border-color:var(--barro);color:var(--blanco)}
.btn.aji{border-color:var(--aji);color:var(--aji)}
.btn.aji.solid{background:var(--aji);color:var(--blanco)}
.btn.small{min-height:36px;padding:6px 14px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{appearance:none;border:1.5px solid var(--linea-2);background:var(--papel);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--monte);flex:none}
.icon-btn svg{width:20px;height:20px}
.link{appearance:none;border:0;background:none;padding:0;color:var(--barro);font-weight:800;text-decoration:underline;text-underline-offset:3px}

.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--barro);margin:0}
.muted{color:var(--suave)}
.stack{display:flex;flex-direction:column;gap:16px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:28px 0 10px}
.section-title h2{font-size:24px}

/* Mes */
.month-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.month-head h1{flex:1;font-size:clamp(34px,10vw,46px);line-height:1}
.month-head h1 span{color:var(--barro);font-size:.5em;margin-left:6px;font-family:var(--f-body);font-weight:800;letter-spacing:.06em;vertical-align:.45em}
.month-stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--suave);margin:0 0 14px}
.month-stats b{color:var(--monte)}
.cal{background:var(--papel);border:1.5px solid var(--monte);border-radius:var(--radio);overflow:hidden}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk{background:var(--monte)}
.wk span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:7px 0;color:var(--crema)}
.wk span:first-child{color:rgba(247,241,227,.55)}
.cell{appearance:none;border:0;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);background:transparent;min-height:60px;padding:6px 2px 9px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;min-width:0;color:var(--monte)}
.grid > :nth-child(7n){border-right:0}
.cell.pad{background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(59,74,47,.04) 6px 7px)}
.cell.lunes{background:var(--lunes);color:rgba(59,74,47,.5)}
.cell.pasado:not(.lunes){color:rgba(59,74,47,.45)}
.cell.pasado .dots{opacity:.5}
.cell.todo-bloq{background:repeating-linear-gradient(-45deg,var(--papel) 0 5px,rgba(42,42,34,.08) 5px 7px)}
.cell .d{font-weight:800;font-size:15px;line-height:1;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell.today .d{background:var(--barro);color:var(--blanco)}
.cell:not(.pad):not(.lunes):hover{background:rgba(196,102,58,.07)}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.d-libre{box-shadow:inset 0 0 0 2px var(--ok)}
.d-verde{background:var(--ok)}
.d-amarillo{background:var(--maiz)}
.d-rojo{background:var(--aji)}
.d-cerrado{background:var(--cerrado)}
.d-bloq{background:repeating-linear-gradient(45deg,var(--carbon) 0 2px,var(--crema) 2px 4px);box-shadow:inset 0 0 0 1px var(--carbon)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 14px;margin-top:12px;font-size:12.5px;color:var(--suave)}
.legend div{display:flex;align-items:center;gap:8px}
.legend .note{grid-column:1/-1;font-size:12px}

/* Tarjetas de lista */
.list{display:flex;flex-direction:column;gap:8px}
.item{appearance:none;width:100%;text-align:left;border:1px solid var(--linea-2);background:var(--papel);border-radius:var(--radio);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;color:var(--monte)}
.item .when{font-family:var(--f-display);font-size:22px;line-height:1;text-align:center;min-width:42px}
.item .when small{display:block;font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--barro);margin-top:3px}
.item strong{display:block;font-weight:800;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--suave)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.4}
.st-pendiente{background:var(--maiz);color:var(--carbon)}
.st-confirmada{background:var(--monte);color:var(--crema)}
.st-sentada{background:var(--barro);color:var(--blanco)}
.st-finalizada{box-shadow:inset 0 0 0 1.5px var(--monte);color:var(--monte)}
.st-cancelada{box-shadow:inset 0 0 0 1.5px var(--suave);color:var(--suave);text-decoration:line-through}
.st-novino{box-shadow:inset 0 0 0 1.5px var(--aji);color:var(--aji)}
.oc-verde{background:var(--ok);color:var(--blanco)}
.oc-amarillo{background:var(--maiz);color:var(--carbon)}
.oc-rojo{background:var(--aji);color:var(--blanco)}
.oc-cerrado{background:var(--cerrado);color:var(--carbon)}
.oc-bloq{background:var(--carbon);color:var(--crema)}

/* Día */
.day-head{display:flex;align-items:center;gap:10px}
.day-head .t{flex:1;min-width:0;text-align:center}
.day-head h1{font-size:clamp(32px,9.5vw,42px);line-height:1}
.day-head p{margin:4px 0 0;font-size:14px;font-weight:700;color:var(--suave)}
.svc-tabs{display:grid;grid-template-columns:1fr 1fr;margin:18px 0 0;border:1.5px solid var(--monte);border-radius:var(--radio);overflow:hidden}
.svc-tabs button{appearance:none;border:0;background:var(--papel);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--monte)}
.svc-tabs button + button{border-left:1.5px solid var(--monte)}
.svc-tabs button[aria-selected="true"]{background:var(--monte);color:var(--crema)}
.svc-tabs .n{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px}
.svc-tabs .s{font-size:12px;opacity:.8}
.occ{margin:16px 0 6px;display:flex;flex-direction:column;gap:8px}
.occ-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.occ-row .big{font-family:var(--f-display);font-size:30px;line-height:1}
.bar{height:10px;border-radius:999px;background:rgba(59,74,47,.12);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:999px}
.bar::before,.bar::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--crema)}
.bar::before{left:50%}.bar::after{left:85%}
.banner{border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin:12px 0}
.banner strong{font-weight:800}
.banner.bloq{background:repeating-linear-gradient(-45deg,var(--papel) 0 8px,#EDE6D6 8px 11px);border:1.5px solid var(--carbon);color:var(--carbon)}
.banner.cerrado{background:var(--lunes);border:1.5px dashed var(--linea-2)}
.banner.error{background:#F6E2DC;border:1.5px solid var(--aji);color:var(--aji)}
.banner.info{background:var(--papel);border:1px solid var(--linea-2)}
.sector{margin:18px 0 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:10px}
.sector::after{content:"";flex:1;height:1px;background:var(--linea-2)}
.res{border:1px solid var(--linea-2);background:var(--papel);border-radius:var(--radio);overflow:hidden}
.res + .res{margin-top:8px}
.res-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px 0}
.res-top strong{font-weight:800;font-size:15px}
.res-top span{font-size:12.5px;color:var(--suave);white-space:nowrap}
.res-body{appearance:none;display:flex;width:100%;border:0;background:transparent;text-align:left;padding:6px 14px 12px;gap:10px;align-items:center;justify-content:space-between;color:var(--monte)}
.res.libre .res-body{color:var(--ok);font-weight:800}
.res.libre .res-body .plus{width:30px;height:30px;border-radius:50%;background:var(--ok);color:var(--blanco);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.res.tomada{border-color:var(--monte);box-shadow:inset 4px 0 0 var(--monte)}
.res.tomada.pend{box-shadow:inset 4px 0 0 var(--maiz)}
.guest{min-width:0}
.guest b{display:block;font-weight:800;overflow-wrap:anywhere}
.guest small{font-size:13px;color:var(--suave)}
.seats{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;padding:8px 14px 2px}
.seats i{height:12px;border-radius:3px;background:rgba(59,74,47,.12)}
.seats i.on{background:var(--barro)}
.seat-list{border-top:1px dashed var(--linea-2)}
.seat-list .res-body + .res-body{border-top:1px dashed var(--linea)}
.res-foot{padding:4px 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.res.fuera{opacity:.7}
details.otras{margin-top:16px;border-top:1px solid var(--linea-2);padding-top:10px}
details.otras summary{font-weight:800;font-size:13.5px;cursor:pointer;color:var(--suave)}
details.otras .list{margin-top:10px}
.empty{text-align:center;padding:28px 16px;border:1.5px dashed var(--linea-2);border-radius:var(--radio);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:24px}
.empty p{margin:0;max-width:34ch;color:var(--suave)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* Formulario */
.form-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.form-head h1{font-size:32px;line-height:1.05;flex:1}
fieldset{border:0;margin:0;padding:0;min-width:0}
.q{border-top:1px solid var(--linea-2);padding-top:14px;margin-top:18px;display:flex;flex-direction:column;gap:10px}
.q legend,.q > .lab{font-family:var(--f-display);font-size:21px;padding:0;margin-bottom:8px;color:var(--monte)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:var(--suave)}
.inp{width:100%;min-height:46px;border:1.5px solid var(--linea-2);background:var(--blanco);border-radius:8px;padding:10px 12px;font-size:16px;color:var(--carbon);font-weight:600}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{border-color:var(--monte);outline:none;box-shadow:0 0 0 3px rgba(59,74,47,.18)}
.inp[aria-invalid="true"]{border-color:var(--aji)}
.err{color:var(--aji);font-size:13px;font-weight:700;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--monte);border-radius:999px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--blanco);padding:9px 6px;min-height:46px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--monte)}
.seg button + button{border-left:1.5px solid var(--monte)}
.seg button[aria-pressed="true"]{background:var(--monte);color:var(--crema)}
.seg button small{font-weight:600;font-size:12px;opacity:.8}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--monte);background:var(--blanco);font-size:26px;line-height:1;color:var(--monte);display:grid;place-items:center}
.stepper input{width:78px;text-align:center;font-family:var(--f-display);font-size:38px;border:0;background:transparent;color:var(--monte);padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .lbl{font-weight:700;color:var(--suave)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;width:100%;text-align:left;border:1.5px solid var(--linea-2);background:var(--blanco);border-radius:var(--radio);padding:11px 14px;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;color:var(--monte)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--monte);display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--monte);background:var(--papel);box-shadow:0 0 0 1.5px var(--monte)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--barro)}
.opt strong{display:block;font-weight:800}
.opt small{font-size:13px;color:var(--suave);display:block}
.opt .tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(59,74,47,.10);white-space:nowrap}
.opt .tag.seat{background:rgba(196,102,58,.16);color:#8E4422}
.hidden-note{font-size:12.5px;color:var(--suave);margin:2px 0 0}
.times{display:flex;flex-wrap:wrap;gap:6px}
.times button{appearance:none;border:1.5px solid var(--linea-2);background:var(--blanco);border-radius:8px;padding:8px 10px;min-width:64px;min-height:42px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--monte)}
.times button[aria-pressed="true"]{background:var(--monte);border-color:var(--monte);color:var(--crema)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{appearance:none;border:1.5px solid var(--linea-2);background:var(--blanco);border-radius:999px;padding:8px 14px;min-height:42px;font-weight:700;color:var(--monte)}
.chips button[aria-pressed="true"]{border-color:var(--barro);background:var(--barro);color:var(--blanco)}
.summary{background:var(--monte);color:var(--crema);border-radius:var(--radio);padding:14px 16px;margin-top:22px;display:flex;flex-direction:column;gap:4px}
.summary b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--crema)}
.summary span{font-size:13.5px;opacity:.85}
.submit-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:14px;padding:10px 0;background:linear-gradient(to bottom,rgba(247,241,227,0),var(--crema) 30%);display:flex;flex-direction:column;gap:8px;z-index:4}

/* Detalle */
.ficha{background:var(--papel);border:1.5px solid var(--monte);border-radius:var(--radio);overflow:hidden;margin-top:12px}
.ficha-top{padding:16px;border-bottom:1px solid var(--linea-2);display:flex;flex-direction:column;gap:8px}
.ficha-top h1{font-size:30px;line-height:1.05;overflow-wrap:anywhere}
.ficha-top .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.code{font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--barro)}
dl.facts{margin:0;display:grid;grid-template-columns:1fr 1fr}
dl.facts div{padding:12px 16px;border-bottom:1px solid var(--linea);min-width:0}
dl.facts div:nth-child(odd){border-right:1px solid var(--linea)}
dl.facts div.full{grid-column:1/-1;border-right:0}
dl.facts dt{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
dl.facts dd{margin:3px 0 0;font-weight:700;overflow-wrap:anywhere}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{border:1.5px solid var(--aji);background:#F8EAE5;border-radius:var(--radio);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-weight:700;color:var(--carbon)}

/* Panel */
.panel-card{background:var(--papel);border:1px solid var(--linea-2);border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea)}
.toggle-row:last-child{border-bottom:0}
.toggle-row strong{font-weight:800;display:block}
.toggle-row small{color:var(--suave);font-size:12.5px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--cerrado);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--blanco);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--barro);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.block-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea)}
.block-item:last-child{border-bottom:0}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
code.k{font-weight:800;background:rgba(59,74,47,.08);padding:1px 6px;border-radius:4px}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(92vw,480px);width:max-content;background:var(--carbon);color:var(--crema);border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(42,42,34,.25)}
.toast.err{background:var(--aji);color:var(--blanco)}

@media (min-width:560px){
  .cell{min-height:78px}
  .cell .d{font-size:17px}
  .dot{width:13px;height:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><small>Comedor</small><b>Garbanzo Cimarrón</b></div>
    <div class="hoy" id="hoy-label"></div>
  </div>
</header>

<main class="wrap" id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Secciones">
  <div class="wrap">
    <button type="button" data-nav="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mes</button>
    <button type="button" data-nav="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Hoy</button>
    <button type="button" data-nav="nueva" class="reservar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Reservar</button>
    <button type="button" data-nav="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Panel</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- Configuración ---------- */
const STORAGE_KEY = 'garbanzo-cimarron.agenda.v1';
const PANEL_SESSION_KEY = 'garbanzo-cimarron.panel';
const PANEL_CLAVE = 'garbanzo2026'; // Clave compartida del panel. Documentada arriba. Sin cuentas ni recuperación.

const SERVICES = {
  almuerzo:{id:'almuerzo', name:'Almuerzo', start:'12:30', end:'15:30'},
  cena:{id:'cena', name:'Cena', start:'20:00', end:'23:30'}
};
const SERVICE_ORDER = ['almuerzo','cena'];
const PROPOSALS = [
  {id:'mediodia', name:'Menú del mediodía', detail:'Entrada, principal y bebida', min:60, price:18000, services:['almuerzo']},
  {id:'carta', name:'Carta libre', detail:'Precio según lo que pidan', min:90, price:null, services:['almuerzo','cena']},
  {id:'pasos', name:'Pasos de estación', detail:'5 pasos', min:120, price:38000, services:['cena']},
  {id:'festejo', name:'Mesa de festejo', detail:'Para el Salón del Fondo', min:150, price:45000, services:['cena'], onlyResource:'r-salon'}
];
const RESTRICTIONS = [{id:'gluten',name:'Sin gluten'},{id:'frutos',name:'Sin frutos secos'},{id:'soja',name:'Sin soja'}];
const STATUS = {
  pendiente:{name:'Pendiente', occupies:true},
  confirmada:{name:'Confirmada', occupies:true},
  sentada:{name:'Sentada', occupies:true},
  finalizada:{name:'Finalizada', occupies:true},
  cancelada:{name:'Cancelada', occupies:false},
  novino:{name:'No vino', occupies:false}
};
const MAX_COVERS = 12;

/* ---------- Utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());
const isMonday = s => parseISO(s).getDay() === 1;
const isValidISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') && !isNaN(parseISO(s));
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fechaLarga = s => { const d = parseISO(s); return `${cap(DIAS[d.getDay()])} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = s => { const d = parseISO(s); return `${DIAS[d.getDay()].slice(0,3)} ${d.getDate()}/${d.getMonth()+1}`; };
const toMin = t => { const [a,b] = t.split(':').map(Number); return a*60+b; };
const toHHMM = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const pesos = n => '$' + Number(n).toLocaleString('es-AR');
const norm = s => String(s||'').trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const pctTxt = p => Math.floor(p) + ' %';
const personas = n => n === 1 ? '1 persona' : `${n} personas`;
const proposal = id => PROPOSALS.find(p => p.id === id);

/* ---------- Semilla ---------- */
function seedResources(){
  return [
    {id:'r-v1', name:'Mesa Ventana 1', sector:'Vereda', capacity:2, mode:'whole', minPeople:0, active:true},
    {id:'r-v2', name:'Mesa Ventana 2', sector:'Vereda', capacity:2, mode:'whole', minPeople:0, active:true},
    {id:'r-jaz', name:'Mesa Jazmín', sector:'Salón', capacity:4, mode:'whole', minPeople:0, active:true},
    {id:'r-rom', name:'Mesa Romero', sector:'Salón', capacity:4, mode:'whole', minPeople:0, active:true},
    {id:'r-alb', name:'Mesa Albahaca', sector:'Salón', capacity:4, mode:'whole', minPeople:0, active:true},
    {id:'r-meson', name:'Mesón Compartido', sector:'Salón', capacity:12, mode:'seat', minPeople:0, active:true},
    {id:'r-p1', name:'Mesa Parra 1', sector:'Patio', capacity:6, mode:'whole', minPeople:0, active:true},
    {id:'r-p2', name:'Mesa Parra 2', sector:'Patio', capacity:6, mode:'whole', minPeople:0, active:true},
    {id:'r-salon', name:'Salón del Fondo', sector:'Privado', capacity:12, mode:'whole', minPeople:8, active:true}
  ];
}
function makeSeed(){
  const T = todayISO(); const wd = parseISO(T).getDay();
  const S = addDays(T, ((6 - wd + 7) % 7) || 7);   // próximo sábado
  const W = addDays(T, ((3 - wd + 7) % 7) || 7);   // próximo miércoles
  const S2 = addDays(S, 7), Sprev = addDays(S, -7);
  const rows = [
    // Sábado próximo, cena: queda en amarillo con el Salón del Fondo libre (caso del briefing)
    [S,'cena','r-v1',2,'21:00','carta','Lucía y Tomás Ferreyra','lucia.ferreyra@example.com',['gluten'],'confirmada','Pareja. Celíaca: avisar a cocina.'],
    [S,'cena','r-meson',3,'21:30','carta','Caro, Meli y Juli','carolina.paez@example.com',[],'confirmada','Tres amigas, prefieren la punta del mesón.'],
    [S,'cena','r-jaz',4,'20:30','pasos','Martín Quiroga','martin.quiroga@example.com',[],'confirmada',''],
    [S,'cena','r-rom',3,'21:00','carta','Sofía Bustos','sofia.bustos@example.com',['soja'],'pendiente','Llamar el viernes para confirmar.'],
    [S,'cena','r-alb',4,'22:00','carta','Nico Funes','nico.funes@example.com',[],'confirmada',''],
    [S,'cena','r-p1',5,'20:00','carta','Familia Ledesma','familia.ledesma@example.com',[],'confirmada','Traen un cochecito.'],
    [S,'cena','r-p2',6,'21:30','pasos','Agustina Vera','agustina.vera@example.com',[],'pendiente',''],
    [S,'cena','r-v2',2,'20:30','carta','Pedro Arias','pedro.arias@example.com',[],'cancelada','Canceló por teléfono.'],
    [S,'almuerzo','r-v2',2,'13:00','mediodia','Ramiro Ortiz','ramiro.ortiz@example.com',[],'confirmada',''],
    [S,'almuerzo','r-meson',4,'13:30','mediodia','Equipo de la librería','libreria.equipo@example.com',[],'confirmada',''],
    // Sábado siguiente, cena: cumpleaños de 12 en el Salón del Fondo, servicio en rojo
    [S2,'cena','r-salon',12,'20:30','festejo','Cumple de Flor Agüero','flor.aguero@example.com',['frutos'],'confirmada','Traen torta propia. Una persona sin frutos secos.'],
    [S2,'cena','r-p1',6,'20:00','carta','Familia Godoy','familia.godoy@example.com',[],'confirmada',''],
    [S2,'cena','r-p2',5,'21:00','pasos','Gabriel Ruiz','gabriel.ruiz@example.com',[],'pendiente',''],
    [S2,'cena','r-jaz',4,'21:00','carta','Inés Molina','ines.molina@example.com',[],'confirmada',''],
    [S2,'cena','r-rom',4,'21:30','carta','Diego Sosa','diego.sosa@example.com',[],'confirmada',''],
    [S2,'cena','r-alb',3,'20:30','pasos','Paula Ríos','paula.rios@example.com',['gluten'],'confirmada',''],
    [S2,'cena','r-v1',2,'21:00','pasos','Ana y Leo','ana.leo@example.com',[],'confirmada',''],
    [S2,'cena','r-v2',2,'22:00','carta','Marcos Herrera','marcos.herrera@example.com',[],'pendiente',''],
    [S2,'cena','r-meson',6,'21:00','carta','Brenda Ochoa','brenda.ochoa@example.com',[],'confirmada','Grupo de la facu.'],
    // Miércoles al mediodía
    [W,'almuerzo','r-jaz',4,'13:00','mediodia','Estudio Nogal','estudio.nogal@example.com',[],'confirmada',''],
    [W,'almuerzo','r-meson',1,'12:30','mediodia','Julieta Carranza','julieta.carranza@example.com',['soja'],'confirmada',''],
    // Semana pasada
    [Sprev,'almuerzo','r-rom',3,'13:00','mediodia','Laura Benítez','laura.benitez@example.com',[],'finalizada',''],
    [Sprev,'almuerzo','r-v1',2,'13:30','carta','Hernán Paz','hernan.paz@example.com',[],'novino','No avisó.']
  ];
  const now = new Date().toISOString();
  const reservations = rows.map((r,i) => ({
    id:'gc-' + pad4(i+1), code:'GC-' + pad4(i+1), date:r[0], service:r[1], resourceId:r[2], covers:r[3], time:r[4],
    proposalId:r[5], name:r[6], email:r[7], restrictions:r[8], status:r[9], notes:r[10], createdAt:now, updatedAt:now
  }));
  return {version:1, seq:rows.length, resources:seedResources(), reservations,
    blocks:[{date:addDays(S,3), service:'almuerzo', reason:'Fumigación del local'}]};
}
function pad4(n){ return String(n).padStart(4,'0'); }

/* ---------- Persistencia ---------- */
let state, storageOK = true, loadError = false;
function persist(next){
  if (window.__simularFalloGuardado) return false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); return true; }
  catch(e){ return false; }
}
function load(){
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch(e){ storageOK = false; state = makeSeed(); return; }
  if (raw === null){                      // primera visita: no existe la clave propia
    state = makeSeed();
    if (!persist(state)) storageOK = false;
    return;
  }
  try {
    const p = JSON.parse(raw);
    if (!p || !Array.isArray(p.resources) || !Array.isArray(p.reservations) || !Array.isArray(p.blocks)) throw new Error('forma');
    state = p;                            // lista vacía incluida: se respeta tal cual
  } catch(e){
    loadError = true;
    state = {version:1, seq:0, resources:seedResources(), reservations:[], blocks:[]};
  }
}
/* Guarda primero; solo si sale bien reemplaza el estado en memoria. */
function commit(next, okMsg){
  if (!persist(next)){
    toast('No se pudo guardar. Lo que cargaste sigue acá: revisá el espacio del navegador y probá de nuevo.', true);
    return false;
  }
  state = next;
  if (okMsg) toast(okMsg);
  return true;
}

/* ---------- Reglas de cupo ---------- */
function serviceState(st, date, svc){
  if (isMonday(date)) return 'cerrado';
  if (st.blocks.some(b => b.date === date && b.service === svc)) return 'bloqueado';
  return 'abierto';
}
function blockOf(st, date, svc){ return st.blocks.find(b => b.date === date && b.service === svc); }
/* Ocupación = cubiertos reservados / capacidad total de los recursos activos.
   Recurso completo: cuenta su capacidad entera aunque vengan menos. Mesón: cuenta asientos reales. */
function serviceUsage(st, date, svc, excludeId){
  const active = st.resources.filter(r => r.active);
  const capacity = active.reduce((a,r) => a + r.capacity, 0);
  const occ = st.reservations.filter(x => x.date === date && x.service === svc && STATUS[x.status]?.occupies && x.id !== excludeId);
  const byRes = {}; let used = 0;
  for (const r of st.resources){
    const list = occ.filter(x => x.resourceId === r.id).sort((a,b) => a.time.localeCompare(b.time));
    let u, free;
    if (r.mode === 'seat'){ const seats = list.reduce((a,x) => a + x.covers, 0); u = Math.min(seats, r.capacity); free = Math.max(0, r.capacity - seats); }
    else { u = list.length ? r.capacity : 0; free = list.length ? 0 : r.capacity; }
    byRes[r.id] = {list, used:u, free};
    if (r.active) used += u;
  }
  const pct = capacity ? used / capacity * 100 : 0;
  return {capacity, used, pct, byRes, count: occ.length};
}
function level(pct){ return pct < 50 ? 'verde' : pct < 85 ? 'amarillo' : 'rojo'; }
function resourceOptions(st, date, svc, covers, excludeId){
  const u = serviceUsage(st, date, svc, excludeId);
  const ok = []; let hidden = 0;
  for (const r of st.resources.filter(r => r.active)){
    const b = u.byRes[r.id];
    if (r.mode === 'seat'){
      if (b.free >= covers) ok.push({r, free:b.free, waste:0}); else hidden++;
    } else {
      if (b.free === 0 || covers > r.capacity || (r.minPeople && covers < r.minPeople)) hidden++;
      else ok.push({r, free:b.free, waste:r.capacity - covers});
    }
  }
  ok.sort((a,b) => a.waste - b.waste || (a.r.mode === 'seat') - (b.r.mode === 'seat') || a.r.capacity - b.r.capacity);
  return {ok, hidden};
}
function timeSlots(svc, proposalId){
  const s = SERVICES[svc]; const dur = proposal(proposalId)?.min ?? 30;
  const start = toMin(s.start); let last = toMin(s.end) - dur; if (last < start) last = start;
  const out = []; for (let m = start; m <= last; m += 30) out.push(toHHMM(m)); return out;
}
function proposalsFor(svc, resourceId){
  return PROPOSALS.filter(p => p.services.includes(svc) && (!p.onlyResource || p.onlyResource === resourceId));
}
function defaultProposal(svc, resourceId){
  if (svc === 'almuerzo') return 'mediodia';
  return resourceId === 'r-salon' ? 'festejo' : 'carta';
}
function resName(id){ return state.resources.find(r => r.id === id)?.name || 'Lugar eliminado'; }
function placeLine(x){
  const r = state.resources.find(r => r.id === x.resourceId);
  if (!r) return personas(x.covers);
  if (r.mode === 'seat') return `${r.name} · ${x.covers} ${x.covers === 1 ? 'asiento' : 'asientos'}`;
  return `${r.name} · ${personas(x.covers)}`;
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 6500 : 3200);
}

/* ---------- Navegación ---------- */
let viewMonth = todayISO().slice(0,7);
let lastSvc = 'almuerzo';
const dayTab = {};
let draft = null;
let panelOpen = (() => { try { return sessionStorage.getItem(PANEL_SESSION_KEY) === '1'; } catch(e){ return false; } })();
let pendingConfirm = null;

function go(hash){
  if (location.hash === '#' + hash) render(); else location.hash = hash;
}
window.addEventListener('hashchange', () => { pendingConfirm = null; render(); });

function render(){
  const hs = location.hash.slice(1) || 'mes';
  const v = $('#view'); let tab = 'mes';
  $('#hoy-label').textContent = fechaCorta(todayISO()).replace(/^\w/, c => c.toUpperCase());
  let m;
  if ((m = hs.match(/^mes-(\d{4}-\d{2})$/))) { renderMes(m[1]); tab = 'mes'; }
  else if (hs === 'mes') { renderMes(viewMonth); tab = 'mes'; }
  else if ((m = hs.match(/^dia-(\d{4}-\d{2}-\d{2})$/)) && isValidISO(m[1])) { renderDia(m[1]); tab = m[1] === todayISO() ? 'hoy' : 'mes'; }
  else if (hs === 'nueva') { renderForm(null); tab = 'nueva'; }
  else if ((m = hs.match(/^editar-(gc-\d+)$/))) { renderForm(m[1]); tab = ''; }
  else if ((m = hs.match(/^reserva-(gc-\d+)$/))) { renderDetalle(m[1]); tab = ''; }
  else if (hs === 'panel') { renderPanel(); tab = 'panel'; }
  else { renderMes(viewMonth); }
  document.querySelectorAll('[data-nav]').forEach(b => {
    if (b.dataset.nav === tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,0);
}
document.querySelector('.tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  const n = b.dataset.nav;
  if (n === 'mes') go('mes-' + viewMonth);
  else if (n === 'hoy') go('dia-' + todayISO());
  else if (n === 'nueva') { draft = null; go('nueva'); }
  else go('panel');
});

/* ---------- Pantalla 1: Mes ---------- */
function dotInfo(date, svc){
  const st = serviceState(state, date, svc);
  if (st === 'cerrado') return {cls:'d-cerrado', label:'cerrado'};
  if (st === 'bloqueado') return {cls:'d-bloq', label:'bloqueado'};
  const u = serviceUsage(state, date, svc);
  return {cls: u.used === 0 ? 'd-libre' : 'd-' + level(u.pct), label: `${pctTxt(u.pct)} ocupado`};
}
function renderMes(ym){
  viewMonth = ym;
  const [y, mo] = ym.split('-').map(Number);
  const first = new Date(y, mo-1, 1, 12);
  const days = new Date(y, mo, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const T = todayISO();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span class="cell pad" aria-hidden="true"></span>';
  for (let d = 1; d <= days; d++){
    const date = `${y}-${pad(mo)}-${pad(d)}`;
    const mon = isMonday(date);
    const a = dotInfo(date,'almuerzo'), c = dotInfo(date,'cena');
    const both = a.cls === 'd-bloq' && c.cls === 'd-bloq';
    const cls = ['cell', mon ? 'lunes' : '', date < T ? 'pasado' : '', date === T ? 'today' : '', both ? 'todo-bloq' : ''].join(' ');
    const label = mon ? `${fechaLarga(date)}. Cerrado.` : `${fechaLarga(date)}. Almuerzo ${a.label}. Cena ${c.label}.`;
    cells += `<button type="button" class="${cls}" data-date="${date}" aria-label="${h(label)}"><span class="d num">${d}</span><span class="dots" aria-hidden="true"><i class="dot ${a.cls}"></i><i class="dot ${c.cls}"></i></span></button>`;
  }
  const trail = (7 - (offset + days) % 7) % 7;
  for (let i = 0; i < trail; i++) cells += '<span class="cell pad" aria-hidden="true"></span>';

  const inMonth = state.reservations.filter(x => x.date.startsWith(ym));
  const activas = inMonth.filter(x => x.status === 'pendiente' || x.status === 'confirmada');
  const cubiertos = activas.reduce((a,x) => a + x.covers, 0);
  const pend = state.reservations.filter(x => x.status === 'pendiente' && x.date >= T).sort((a,b) => (a.date+a.service+a.time).localeCompare(b.date+b.service+b.time));
  const prev = iso(new Date(y, mo-2, 1, 12)).slice(0,7), next = iso(new Date(y, mo, 1, 12)).slice(0,7);

  let pendHtml;
  if (pend.length){
    pendHtml = `<div class="list">${pend.slice(0,8).map(itemHtml).join('')}</div>`;
  } else {
    pendHtml = `<div class="empty"><h3>Todo confirmado</h3><p>No hay reservas esperando confirmación. Las nuevas en «Pendiente» van a aparecer acá.</p></div>`;
  }

  $('#view').innerHTML = `
    ${banners()}
    <div class="month-head">
      <button class="icon-btn" type="button" data-month="${prev}" aria-label="Mes anterior">${chev('l')}</button>
      <h1>${cap(MESES[mo-1])}<span class="num">${y}</span></h1>
      <button class="icon-btn" type="button" data-month="${next}" aria-label="Mes siguiente">${chev('r')}</button>
    </div>

  }).join('');

function servicePanel(date, svc){
  const T = todayISO();
  const S = SERVICES[svc];
  const stt = serviceState(state, date, svc);
  const u = serviceUsage(state, date, svc);
  const lv = level(u.pct);
  const past = date < T;
  const canBook = stt === 'abierto' && !past;
  let out = '';
  out += `<div class="occ">
    <div class="occ-row"><span class="big num">${pctTxt(u.pct)}</span><span class="pill ${stt === 'bloqueado' ? 'oc-bloq' : 'oc-' + lv}">${stt === 'bloqueado' ? 'Bloqueado' : lv === 'verde' ? 'Hay lugar' : lv === 'amarillo' ? 'Se va llenando' : 'Casi lleno'}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.min(100,u.pct)}%;background:var(${lv === 'verde' ? '--ok' : lv === 'amarillo' ? '--maiz' : '--aji'})"></i></div>
    <div class="occ-row muted" style="font-size:13px"><span class="num">${u.used} de ${u.capacity} cubiertos · ${S.start} a ${S.end}</span><span class="num">${u.count} ${u.count === 1 ? 'reserva' : 'reservas'}</span></div>
  </div>`;
  if (stt === 'bloqueado'){
    const b = blockOf(state, date, svc);
    out += `<div class="banner bloq"><strong>Servicio bloqueado${b?.reason ? ': ' + h(b.reason) : ''}.</strong><span>No se toman reservas nuevas. Las que ya estaban siguen abajo.</span></div>`;
  } else if (past){
    out += `<div class="banner info"><span>Este día ya pasó. Podés revisar y cambiar estados, pero no cargar reservas nuevas.</span></div>`;
  }
  if (canBook) out += `<div class="cta-row" style="margin-top:8px"><button class="btn barro wide" type="button" data-new="${date}|${svc}">Reservar para ${svc === 'cena' ? 'la cena' : 'el almuerzo'}</button></div>`;

  const sectors = [];
  for (const r of state.resources){ if (!sectors.includes(r.sector)) sectors.push(r.sector); }
  for (const sec of sectors){
    const rs = state.resources.filter(r => r.sector === sec && (r.active || u.byRes[r.id].list.length));
    if (!rs.length) continue;
    out += `<div class="sector">${h(sec)}</div>`;
    for (const r of rs) out += resourceCard(r, u.byRes[r.id], date, svc, canBook);
  }
  if (!state.resources.some(r => r.active)) out += `<div class="empty"><h3>Sin mesas activas</h3><p>Activá mesas desde el panel para poder reservar.</p></div>`;
  const others = state.reservations.filter(x => x.date === date && x.service === svc && !STATUS[x.status].occupies);
  if (others.length) out += `<details class="otras"><summary>Canceladas y no vinieron (${others.length})</summary><div class="list">${others.map(itemHtml).join('')}</div></details>`;
  if (!u.count && stt === 'abierto') out += `<p class="muted" style="text-align:center;margin-top:18px">Todavía no hay reservas para ${S.name.toLowerCase() === 'cena' ? 'la cena' : 'el almuerzo'}. Queda todo libre.</p>`;
  return out;
}
function resourceCard(r, b, date, svc, canBook){
  const cap = r.mode === 'seat' ? `${r.capacity} asientos` : r.minPeople ? `Hasta ${r.capacity} · mín. ${r.minPeople}` : `Mesa para ${r.capacity}`;
  const off = r.active ? '' : ' fuera';
  const top = `<div class="res-top"><strong>${h(r.name)}</strong><span>${cap}${r.active ? '' : ' · fuera de servicio'}</span></div>`;
  if (r.mode === 'seat'){
    let seatsHtml = ''; for (let i = 0; i < r.capacity; i++) seatsHtml += `<i class="${i < b.used ? 'on' : ''}"></i>`;
    const list = b.list.map(x => guestRow(x)).join('');
    return `<div class="res${off}">${top}<div class="seats" aria-hidden="true">${seatsHtml}</div>
      <div class="res-foot"><span class="num"><b>${b.free ? `Quedan ${b.free} ${b.free === 1 ? 'asiento' : 'asientos'}` : 'Mesón completo'}</b> de ${r.capacity}</span>${canBook && b.free && r.active ? `<button class="btn small" type="button" data-new="${date}|${svc}|${r.id}">Sumar gente</button>` : ''}</div>
      ${list ? `<div class="seat-list">${list}</div>` : ''}</div>`;
  }
  if (b.list.length){
    const x = b.list[0];
    return `<div class="res tomada${x.status === 'pendiente' ? ' pend' : ''}${off}">${top}${guestRow(x)}</div>`;
  }
  if (!canBook || !r.active) return `<div class="res${off}">${top}<div class="res-body"><span class="muted">${r.active ? 'Libre' : 'No se ofrece'}</span></div></div>`;
  return `<div class="res libre">${top}<button type="button" class="res-body" data-new="${date}|${svc}|${r.id}"><span>Queda libre</span><span class="plus" aria-hidden="true">+</span></button></div>`;
}
function guestRow(x){
  const r = state.resources.find(r => r.id === x.resourceId);
  const covers = r && r.mode === 'whole' && x.covers < r.capacity ? `${x.covers} de ${r.capacity}` : personas(x.covers);
  const rest = x.restrictions?.length ? ' · ' + x.restrictions.map(id => RESTRICTIONS.find(z => z.id === id)?.name).join(', ').toLowerCase() : '';
  return `<button type="button" class="res-body" data-res="${x.id}"><span class="guest"><b>${h(x.name)}</b><small class="num">${x.time} · ${covers}${h(rest)}</small></span><span class="pill st-${x.status}">${STATUS[x.status].name}</span></button>`;
}

/* ---------- Pantalla 3: Formulario ---------- */
function newDraft(pre){

  return {id:null, date, service:svc, covers, resourceId:pre?.resourceId || null, proposalId:null, time:null,
    name:'', email:'', restrictions:[], notes:'', status:'pendiente'};
}

function refreshForm(){
  const d = draft; if (!d) return;
  const T = todayISO();
  const excl = d.id || undefined;
  // Servicios
  $('#f-svc').innerHTML = SERVICE_ORDER.map(s => {
    const stt = isValidISO(d.date) ? serviceState(state, d.date, s) : 'abierto';
    const sub = !isValidISO(d.date) ? '' : stt === 'cerrado' ? 'cerrado' : stt === 'bloqueado' ? 'bloqueado' : pctTxt(serviceUsage(state, d.date, s, excl).pct);
    return `<button type="button" data-fsvc="${s}" aria-pressed="${d.service === s}">${SERVICES[s].name} <small class="num">${sub}</small></button>`;
  }).join('');
  // Estado del servicio
  let block = '';
  if (!isValidISO(d.date)) block = 'Elegí una fecha.';
  else if (!d.id && d.date < T) block = 'Esa fecha ya pasó. Elegí hoy o un día que viene.';
  else if (isMonday(d.date)) block = 'Los lunes el comedor está cerrado. No se toman reservas.';
  else if (serviceState(state, d.date, d.service) === 'bloqueado'){ const b = blockOf(state, d.date, d.service); block = `Ese ${SERVICES[d.service].name.toLowerCase()} está bloqueado${b?.reason ? ' (' + b.reason + ')' : ''}. No se toman reservas nuevas.`; }
  $('#f-alert').innerHTML = block ? `<div class="banner ${isMonday(d.date) ? 'cerrado' : 'bloq'}" style="margin:4px 0 0"><strong>${h(block)}</strong></div>` : '';
  ['q-covers','q-res','q-prop'].forEach(id => { $('#' + id).hidden = !!block; });
  $('#f-covers-lbl').textContent = d.covers === 1 ? 'cubierto' : 'cubiertos';
  // Recursos con lugar suficiente
  let opts = {ok:[], hidden:0};
  if (!block){
    opts = resourceOptions(state, d.date, d.service, d.covers, excl);
    if (d.resourceId && !opts.ok.some(o => o.r.id === d.resourceId)) d.resourceId = null;
    $('#f-res').innerHTML = opts.ok.length ? opts.ok.map(o => {
      const r = o.r; const sel = d.resourceId === r.id;
      let sub, tag;
      if (r.mode === 'seat'){ sub = `${h(r.sector)} · quedan ${o.free} de ${r.capacity} asientos`; tag = `<span class="tag seat">Toma ${d.covers} ${d.covers === 1 ? 'asiento' : 'asientos'}</span>`; }
      else { sub = `${h(r.sector)} · ${r.minPeople ? `hasta ${r.capacity}, mínimo ${r.minPeople}` : `Mesa para ${r.capacity}`}`; tag = `<span class="tag">${d.covers < r.capacity ? 'Ocupa la mesa entera' : 'Justo'}</span>`; }
      return `<button type="button" class="opt" role="radio" aria-checked="${sel}" data-fres="${r.id}"><span class="radio"></span><span><strong>${h(r.name)}</strong><small>${sub}</small></span>${tag}</button>`;
    }).join('') + (opts.hidden ? `<p class="hidden-note">${opts.hidden} ${opts.hidden === 1 ? 'lugar no aparece porque' : 'lugares no aparecen porque'} ya ${opts.hidden === 1 ? 'está tomado o no es' : 'están tomados o no son'} para ${personas(d.covers)}.</p>` : '')
    : `<div class="empty"><h3>No queda lugar</h3><p>Para ${personas(d.covers)} en ${d.service === 'cena' ? 'la cena' : 'el almuerzo'} no hay mesa libre. Probá el otro servicio, otro día o menos cubiertos.</p></div>`;
    // Propuestas
    const props = proposalsFor(d.service, d.resourceId);
    if (!d.proposalId || !props.some(p => p.id === d.proposalId)) d.proposalId = props.some(p => p.id === defaultProposal(d.service, d.resourceId)) ? defaultProposal(d.service, d.resourceId) : props[0]?.id;
    $('#f-prop').innerHTML = props.map(p => `<button type="button" class="opt" role="radio" aria-checked="${d.proposalId === p.id}" data-fprop="${p.id}"><span class="radio"></span><span><strong>${p.name}</strong><small>${p.detail} · ${p.min} min</small></span><span class="tag">${p.price ? pesos(p.price) : 'Variable'}</span></button>`).join('');
    const slots = timeSlots(d.service, d.proposalId);
    if (!d.time || !slots.includes(d.time)) d.time = slots[0];
    $('#f-time').innerHTML = slots.map(t => `<button type="button" data-ftime="${t}" aria-pressed="${d.time === t}">${t}</button>`).join('');
  }
  // Resumen
  const r = state.resources.find(r => r.id === d.resourceId);
  const p = proposal(d.proposalId);
  let sum = '';
  if (block) sum = `<b>Sin lugar para reservar</b><span>${h(block)}</span>`;
  else if (!r) sum = `<b>${personas(d.covers)}</b><span>${isValidISO(d.date) ? fechaLarga(d.date) : ''} · ${SERVICES[d.service].name}. Elegí dónde se sientan.</span>`;
  else {
    const what = r.mode === 'seat' ? `${r.name} · toma ${d.covers} ${d.covers === 1 ? 'asiento' : 'asientos'}` : `${r.name} · ${d.covers < r.capacity ? `ocupa la mesa entera (${r.capacity})` : `mesa para ${r.capacity}`}`;
    const money = p?.price ? ` · ${pesos(p.price)} por persona, unos ${pesos(p.price * d.covers)} en total` : ' · precio según carta';
    sum = `<b>${fechaLarga(d.date)}, ${d.time}</b><span>${h(what)}</span><span>${p ? p.name : ''}${money}</span>`;
  }
  $('#f-summary').innerHTML = sum;
  $('#f-submit').disabled = !!block || !opts.ok.length;
}
function setCovers(n){
  n = Math.max(1, Math.min(MAX_COVERS, parseInt(n,10) || 1));
  if (String($('#f-covers').value) !== String(n)) $('#f-covers').value = n;
  if (draft.covers === n) return;   // evita re-pintar la lista justo cuando se toca una opción
  draft.covers = n; refreshForm();
}
function showErr(id, msg){ const e = $('#' + id); if (!e) return; e.textContent = msg || ''; e.hidden = !msg; }
function submitForm(){
  const d = draft; const T = todayISO();
  d.name = $('#f-name').value; d.email = $('#f-email').value; d.notes = $('#f-notes').value;
  const name = d.name.trim(), email = d.email.trim();
  let bad = false;
  showErr('e-name', name ? '' : 'Poné un nombre para la reserva.'); if (!name) bad = true;
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  showErr('e-email', emailOk ? '' : 'Revisá el correo: tiene que ser del tipo nombre@example.com.'); if (!emailOk) bad = true;
  $('#f-name').setAttribute('aria-invalid', !name); $('#f-email').setAttribute('aria-invalid', !emailOk);
  showErr('e-res', d.resourceId ? '' : 'Elegí dónde se sientan.'); if (!d.resourceId) bad = true;
  showErr('e-form', '');
  if (bad){ showErr('e-form', 'Faltan datos. Revisá lo marcado en rojo.'); return; }
  // Volver a chequear el cupo justo antes de guardar
  if (isMonday(d.date) || serviceState(state, d.date, d.service) !== 'abierto' || (!d.id && d.date < T)){ refreshForm(); showErr('e-form', 'Ese servicio no acepta reservas.'); return; }
  const opts = resourceOptions(state, d.date, d.service, d.covers, d.id || undefined);
  if (!opts.ok.some(o => o.r.id === d.resourceId)){ refreshForm(); showErr('e-form', 'Ese lugar ya no está disponible. Elegí otro.'); return; }
  // Duplicado: correo + fecha + servicio, sin espacios y en minúsculas
  const dup = state.reservations.find(x => x.id !== d.id && STATUS[x.status].occupies && norm(x.email) === norm(email) && x.date === d.date && x.service === d.service);
  if (dup){ showErr('e-form', `Ya hay una reserva activa con ese correo para ese servicio (${dup.code}, ${dup.name}).`); return; }
  const next = clone(state); const now = new Date().toISOString();
  let id;
  const fields = {date:d.date, service:d.service, resourceId:d.resourceId, covers:d.covers, time:d.time, proposalId:d.proposalId,
    name, email, restrictions:[...d.restrictions], notes:d.notes.trim(), updatedAt:now};
  if (d.id){
    const x = next.reservations.find(x => x.id === d.id);
    Object.assign(x, fields);
    if (x.status === 'pendiente' || x.status === 'confirmada') x.status = d.status;
    id = d.id;
  } else {
    next.seq = (next.seq || 0) + 1;
    id = 'gc-' + pad4(next.seq);
    next.reservations.push({id, code:'GC-' + pad4(next.seq), status:d.status, createdAt:now, ...fields});
  }
  const code = next.reservations.find(x => x.id === id).code;
  if (!commit(next, d.id ? `Cambios guardados · ${code}` : `Reserva guardada · ${code}`)){
    showErr('e-form', 'No se pudo guardar. No cambió nada: lo que cargaste sigue acá.');
    return;
  }
  lastSvc = d.service; dayTab[d.date] = d.service; draft = null;
  go('reserva-' + id);
}

/* ---------- Pantalla 4: Detalle ---------- */
function renderMissing(){
  $('#view').innerHTML = `<div class="empty" style="margin-top:24px"><h3>No encontramos esa reserva</h3><p>Puede que se haya borrado al restaurar los datos.</p><button class="btn" type="button" data-month="${viewMonth}">Ir al mes</button></div>`;
}
function renderDetalle(id){
  const x = state.reservations.find(x => x.id === id);
  if (!x){ renderMissing(); return; }
  const r = state.resources.find(r => r.id === x.resourceId);
  const p = proposal(x.proposalId);
  const S = SERVICES[x.service];
  const where = r ? (r.mode === 'seat' ? `${r.name} · ${x.covers} ${x.covers === 1 ? 'asiento' : 'asientos'}` : `${r.name} · Mesa para ${r.capacity}`) : 'Lugar eliminado';
  const rest = x.restrictions?.length ? x.restrictions.map(id => RESTRICTIONS.find(z => z.id === id)?.name).join(', ') : 'Ninguna';
  let actions = '';
  const st = x.status;
  if (pendingConfirm && pendingConfirm.id === id){
    const verb = pendingConfirm.to === 'cancelada' ? 'cancelar' : 'marcar «No vino» en';
    actions = `<div class="confirm" role="alertdialog" aria-label="Confirmar"><p>¿Seguro que querés ${verb} la reserva de ${h(x.name)}? ${r ? (r.mode === 'seat' ? `Los ${x.covers} asientos del mesón` : `${h(r.name)}`) + ' vuelve' + (r.mode === 'seat' ? 'n' : '') + ' a quedar libre' + (r.mode === 'seat' ? 's' : '') + ' enseguida.' : ''}</p>
      <div class="two actions" style="margin:0"><button class="btn aji solid" type="button" data-setst="${pendingConfirm.to}" data-ok="1">Sí, ${pendingConfirm.to === 'cancelada' ? 'cancelar' : 'no vino'}</button><button class="btn" type="button" data-unconfirm>No, volver</button></div></div>`;
  } else if (st === 'pendiente'){
    actions = `<button class="btn solid wide" type="button" data-setst="confirmada">Confirmar reserva</button>
      <div class="two"><button class="btn" type="button" data-edit="${id}">Editar</button><button class="btn" type="button" data-setst="sentada">Llegó: sentar</button></div>
      <div class="two"><button class="btn aji" type="button" data-setst="cancelada">Cancelar</button><button class="btn aji" type="button" data-setst="novino">No vino</button></div>`;
  } else if (st === 'confirmada'){
    actions = `<button class="btn solid wide" type="button" data-setst="sentada">Llegó: sentar</button>
      <div class="two"><button class="btn" type="button" data-edit="${id}">Editar</button><button class="btn" type="button" data-setst="pendiente">Volver a pendiente</button></div>
      <div class="two"><button class="btn aji" type="button" data-setst="cancelada">Cancelar</button><button class="btn aji" type="button" data-setst="novino">No vino</button></div>`;
  } else if (st === 'sentada'){
    actions = `<button class="btn solid wide" type="button" data-setst="finalizada">Finalizar mesa</button>`;
  } else {
    actions = `<div class="banner info" style="margin:0"><span>${st === 'finalizada' ? 'La mesa ya se cerró.' : st === 'cancelada' ? 'Reserva cancelada: el lugar ya quedó libre.' : 'Marcada como «No vino»: el lugar ya quedó libre.'}</span></div>`;
  }
  $('#view').innerHTML = `${banners()}
    <div class="form-head"><button class="icon-btn" type="button" data-back="dia-${x.date}" aria-label="Volver al día">${chev('l')}</button><p class="eyebrow" style="flex:1">${h(fechaLarga(x.date))}</p></div>
    <article class="ficha">
      <div class="ficha-top"><div class="row"><span class="code">${x.code}</span><span class="pill st-${st}">${STATUS[st].name}</span></div><h1>${h(x.name)}</h1></div>
      <dl class="facts">
        <div><dt>Servicio</dt><dd class="num">${S.name} · ${x.time}</dd></div>
        <div><dt>Cubiertos</dt><dd class="num">${personas(x.covers)}</dd></div>
        <div class="full"><dt>Lugar</dt><dd>${h(where)}${r && r.mode === 'whole' && x.covers < r.capacity ? ' <span class="muted">(ocupa la mesa entera)</span>' : ''}</dd></div>
        <div class="full"><dt>Propuesta</dt><dd>${p ? `${p.name} · ${p.min} min · ${p.price ? `${pesos(p.price)} por persona` : 'precio variable'}` : '—'}</dd></div>
        <div><dt>Restricciones</dt><dd>${h(rest)}</dd></div>
        <div><dt>Correo</dt><dd>${h(x.email)}</dd></div>
        ${x.notes ? `<div class="full"><dt>Notas</dt><dd>${h(x.notes)}</dd></div>` : ''}
      </dl>
    </article>
    <div class="actions">${actions}</div>
    <div class="cta-row"><button class="link" type="button" data-back="dia-${x.date}">Ver ${x.service === 'cena' ? 'la cena' : 'el almuerzo'} de ese día</button></div>`;
}
function setStatus(id, to){
  const next = clone(state); const x = next.reservations.find(x => x.id === id); if (!x) return;
  // Volver a pendiente o confirmar no puede pisar otra reserva (no aplica: ya ocupaba lugar)
  x.status = to; x.updatedAt = new Date().toISOString();
  const msgs = {confirmada:'Reserva confirmada', pendiente:'Volvió a pendiente', sentada:'Mesa sentada', finalizada:'Mesa finalizada', cancelada:'Reserva cancelada · queda libre', novino:'Marcada «No vino» · queda libre'};
  pendingConfirm = null;
  commit(next, msgs[to]);
  render();
}

/* ---------- Pantalla 5: Panel ---------- */
function renderPanel(){
  if (!panelOpen){
    $('#view').innerHTML = `${banners()}
      <p class="eyebrow">Encargado</p><h1 style="font-size:36px;margin:4px 0 8px">Panel</h1>
      <p class="muted" style="margin:0 0 16px">Mesas activas, bloqueos de servicio y datos de prueba. Pedí la clave del local.</p>
      <form id="lock" class="panel-card" novalidate>
        <label class="f" for="p-key">Clave del panel<input class="inp" id="p-key" type="password" autocomplete="off"></label>
        <p class="err" id="e-key" hidden></p>
        <button class="btn solid" type="submit">Entrar</button>
      </form>`;
    return;
  }
  const T = todayISO();
  const capTotal = state.resources.filter(r => r.active).reduce((a,r) => a + r.capacity, 0);
  const blocks = state.blocks.filter(b => b.date >= T).sort((a,b) => (a.date + a.service).localeCompare(b.date + b.service));
  const confirmBox = (kind) => pendingConfirm && pendingConfirm.panel === kind;
  $('#view').innerHTML = `${banners()}
    <div class="occ-row" style="align-items:center"><div><p class="eyebrow">Encargado</p><h1 style="font-size:36px;margin-top:4px">Panel</h1></div><button class="btn small" type="button" id="p-out">Cerrar panel</button></div>

    <div class="section-title"><h2>Mesas y lugares</h2><span class="muted num">${capTotal} cubiertos por servicio</span></div>
    <div class="panel-card">${state.resources.map(r => `
      <div class="toggle-row"><div><strong>${h(r.name)}</strong><small>${h(r.sector)} · ${r.mode === 'seat' ? `${r.capacity} asientos, por asiento` : `${r.capacity} cubiertos, mesa entera${r.minPeople ? `, mínimo ${r.minPeople}` : ''}`}</small></div>
      <label class="switch"><input type="checkbox" data-toggle="${r.id}" ${r.active ? 'checked' : ''} aria-label="${h(r.name)} activa"><span></span></label></div>`).join('')}
    </div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">Una mesa inactiva no se ofrece ni suma a la capacidad. Sus reservas siguen guardadas.</p>

    <div class="section-title"><h2>Bloquear un servicio</h2></div>
    <form id="blk" class="panel-card" novalidate>
      <div class="grid2"><label class="f" for="b-date">Fecha<input class="inp" type="date" id="b-date" min="${T}"></label>
      <label class="f" for="b-svc">Servicio<select class="inp" id="b-svc"><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option><option value="ambos">Los dos</option></select></label></div>
      <label class="f" for="b-reason">Motivo<input class="inp" id="b-reason" placeholder="Ej.: evento privado, fumigación"></label>
      <p class="err" id="e-blk" hidden></p>
      <button class="btn solid" type="submit">Bloquear</button>
    </form>
    <div class="panel-card" style="margin-top:10px">${blocks.length ? blocks.map(b => `<div class="block-item"><div><strong class="num">${h(fechaLarga(b.date))}</strong><br><small class="muted">${SERVICES[b.service].name}${b.reason ? ' · ' + h(b.reason) : ''}</small></div><button class="btn small" type="button" data-unblock="${b.date}|${b.service}">Quitar</button></div>`).join('') : `<p class="muted" style="margin:0">No hay servicios bloqueados de acá en adelante.</p>`}</div>

    <div class="section-title"><h2>Datos</h2></div>
    <div class="panel-card">
      <p style="margin:0">Todo se guarda en este navegador, en la clave <code class="k">${STORAGE_KEY}</code>. ${state.reservations.length} reservas guardadas.</p>
      ${confirmBox('vaciar') ? `<div class="confirm"><p>Se borran todas las reservas. Las mesas y los bloqueos quedan. ¿Seguimos?</p><div class="actions two" style="margin:0"><button class="btn aji solid" type="button" id="p-vaciar-ok">Sí, borrar</button><button class="btn" type="button" data-unconfirm>No</button></div></div>` : `<button class="btn aji" type="button" id="p-vaciar">Borrar todas las reservas</button>`}
      ${confirmBox('restaurar') ? `<div class="confirm"><p>Se reemplazan las reservas, mesas y bloqueos de esta agenda por los datos de prueba. No toca nada fuera de esta app. ¿Seguimos?</p><div class="actions two" style="margin:0"><button class="btn aji solid" type="button" id="p-restore-ok">Sí, restaurar</button><button class="btn" type="button" data-unconfirm>No</button></div></div>` : `<button class="btn" type="button" id="p-restore">Restaurar datos de prueba</button>`}
    </div>

    <div class="section-title"><h2>Probar el caso de Valentina</h2></div>
    <div class="panel-card"><ol class="steps">
      <li>En el mes, el sábado próximo tiene la cena en amarillo.</li>
      <li>Entrá al día, pestaña Cena: el Salón del Fondo dice «Queda libre».</li>
      <li>Tocalo, poné 12 cubiertos, dejala en «Pendiente» y guardá.</li>
      <li>El sábado siguiente hay un cumpleaños de 12 confirmado. Cancelalo y el salón vuelve a quedar libre, sin recargar.</li>
    </ol></div>`;
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.month){ go('mes-' + ds.month); return; }
  if (ds.date){ go('dia-' + ds.date); return; }
  if (ds.day){ go('dia-' + ds.day); return; }
  if (ds.back){ go(ds.back); return; }
  if (ds.svc){ const date = (location.hash.match(/dia-(.+)$/) || [])[1]; dayTab[date] = ds.svc; lastSvc = ds.svc; renderDia(date); return; }
  if (ds.res){ go('reserva-' + ds.res); return; }
  if (ds.new){ const [date, service, resourceId] = ds.new.split('|'); draft = newDraft({date, service, resourceId}); go('nueva'); return; }
  if (ds.edit){ draft = null; go('editar-' + ds.edit); return; }
  if (ds.setst){
    const id = (location.hash.match(/reserva-(gc-\d+)/) || [])[1];
    if ((ds.setst === 'cancelada' || ds.setst === 'novino') && !ds.ok){ pendingConfirm = {id, to:ds.setst}; renderDetalle(id); return; }
    setStatus(id, ds.setst); return;
  }
  if ('unconfirm' in ds){ pendingConfirm = null; render(); return; }
  // Formulario
  if (draft && $('#f')){
    if (ds.fsvc){ draft.service = ds.fsvc; lastSvc = ds.fsvc; draft.proposalId = null; refreshForm(); return; }
    if (ds.step){ setCovers(draft.covers + Number(ds.step)); return; }
    if (ds.fres){ draft.resourceId = ds.fres; showErr('e-res',''); refreshForm(); return; }
    if (ds.fprop){ draft.proposalId = ds.fprop; refreshForm(); return; }
    if (ds.ftime){ draft.time = ds.ftime; refreshForm(); return; }
    if (ds.rest){ const i = draft.restrictions.indexOf(ds.rest); if (i < 0) draft.restrictions.push(ds.rest); else draft.restrictions.splice(i,1); t.setAttribute('aria-pressed', i < 0); return; }
    if (ds.status){ draft.status = ds.status; document.querySelectorAll('[data-status]').forEach(b => b.setAttribute('aria-pressed', b.dataset.status === ds.status)); return; }
  }
  // Panel
  if (t.id === 'p-out'){ panelOpen = false; try { sessionStorage.removeItem(PANEL_SESSION_KEY); } catch(e){} renderPanel(); return; }
  if (ds.unblock){
    const [date, service] = ds.unblock.split('|');
    const next = clone(state); next.blocks = next.blocks.filter(b => !(b.date === date && b.service === service));
    if (commit(next, 'Servicio desbloqueado')) renderPanel(); return;
  }
  if (t.id === 'p-vaciar'){ pendingConfirm = {panel:'vaciar'}; renderPanel(); return; }
  if (t.id === 'p-restore'){ pendingConfirm = {panel:'restaurar'}; renderPanel(); return; }
  if (t.id === 'p-vaciar-ok'){ const next = clone(state); next.reservations = []; pendingConfirm = null; if (commit(next, 'Reservas borradas')) {} renderPanel(); return; }
  if (t.id === 'p-restore-ok'){
    const next = makeSeed(); pendingConfirm = null;
    if (commit(next, 'Datos de prueba restaurados')){ loadError = false; storageOK = true; }
    renderPanel(); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-date' && draft){ draft.date = t.value; refreshForm(); return; }
  if (t.id === 'f-covers' && draft){ setCovers(t.value); return; }
  if (t.dataset && t.dataset.toggle){
    const next = clone(state); const r = next.resources.find(r => r.id === t.dataset.toggle); r.active = t.checked;
    if (!commit(next, `${r.name}: ${r.active ? 'activa' : 'fuera de servicio'}`)) t.checked = !t.checked;
    else renderPanel();
  }
});
document.addEventListener('input', e => {
  const t = e.target; if (!draft) return;
  if (t.id === 'f-covers'){ if (t.value !== '') setCovers(t.value); }
  else if (t.id === 'f-name') draft.name = t.value;
  else if (t.id === 'f-email') draft.email = t.value;
  else if (t.id === 'f-notes') draft.notes = t.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'f'){ submitForm(); return; }
  if (f.id === 'lock'){
    const v = $('#p-key').value.trim();
    if (v === PANEL_CLAVE){ panelOpen = true; try { sessionStorage.setItem(PANEL_SESSION_KEY,'1'); } catch(err){} renderPanel(); }
    else { showErr('e-key', 'Esa clave no es. Probá de nuevo.'); $('#p-key').setAttribute('aria-invalid','true'); }
    return;
  }
  if (f.id === 'blk'){
    const date = $('#b-date').value, svc = $('#b-svc').value, reason = $('#b-reason').value.trim();
    if (!isValidISO(date)){ showErr('e-blk', 'Elegí una fecha.'); return; }
    if (date < todayISO()){ showErr('e-blk', 'Esa fecha ya pasó.'); return; }
    if (isMonday(date)){ showErr('e-blk', 'Los lunes ya está cerrado: no hace falta bloquearlo.'); return; }
    const svcs = svc === 'ambos' ? SERVICE_ORDER : [svc];
    const nuevos = svcs.filter(s => !state.blocks.some(b => b.date === date && b.service === s));
    if (!nuevos.length){ showErr('e-blk', 'Ese servicio ya estaba bloqueado.'); return; }
    const next = clone(state); nuevos.forEach(s => next.blocks.push({date, service:s, reason}));
    const activos = state.reservations.filter(x => x.date === date && nuevos.includes(x.service) && STATUS[x.status].occupies).length;
    if (commit(next, activos ? `Bloqueado. Ojo: ya había ${activos} ${activos === 1 ? 'reserva' : 'reservas'}, siguen en pie.` : 'Servicio bloqueado')) renderPanel();
  }
});

load();
render();
})();
</script>
</body>
</html>
